
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prenotazioni in manutenzione — ViaggiWorld</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .maintenance {
      min-height: 85vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px 20px;
    }
    .maintenance-content { max-width: 560px; }
    .maintenance-icon { font-size: 56px; }
    .maintenance h1 { font-size: clamp(2rem, 6vw, 3.5rem); }
    .maintenance p { line-height: 1.7; }
  </style>
</head>
<body>
  <main class="maintenance">
    <div class="maintenance-content">
      <div class="maintenance-icon">✈️</div>
      <p class="eyebrow">VIAGGIWORLD</p>
      <h1>Prenotazioni in <span class="accent">manutenzione.</span></h1>
      <p>Stiamo preparando il nostro servizio di prenotazione.
         Torna presto per organizzare il tuo prossimo viaggio!</p>
      <a class="btn btn-primary" href="/">Torna alle offerte</a>
    </div>
  </main>
</body>
</html>
