<h2>Aggiungi offerta</h2>

<form id="offerForm">
  <input type="text" name="title" placeholder="Titolo" required>

  <textarea
    name="description"
    placeholder="Descrizione"
    required
  ></textarea>

  <input
    type="number"
    name="price"
    placeholder="Prezzo"
    required
  >

  <input
    type="url"
    name="image_url"
    placeholder="URL immagine"
  >

  <button type="submit">
    Pubblica offerta
  </button>
</form>

<p id="adminStatus"></p>
